<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Realtime Tester</title>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@300;400;500;600&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0f14;
      --bg2: #13161d;
      --bg3: #1a1e27;
      --border: rgba(255, 255, 255, 0.07);
      --border2: rgba(255, 255, 255, 0.13);
      --text: #e8eaf0;
      --muted: #6b7080;
      --accent: #00e5a0;
      --accent2: #00b87a;
      --danger: #ff5c5c;
      --warn: #f5a623;
      --info: #4a9eff;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    html {
      font-size: 14px;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 340px 1fr;
      grid-template-rows: auto 1fr;
    }

    /* HEADER */
    header {
      grid-column: 1 / -1;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg2);
    }

    .logo {
      width: 34px;
      height: 34px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 18px;
      height: 18px;
    }

    header h1 {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .05em;
      color: var(--text);
    }

    header p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }

    .connection-pill {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid var(--border2);
      color: var(--muted);
      background: var(--bg3);
      transition: all .3s;
    }

    .connection-pill.connected {
      color: var(--accent);
      border-color: var(--accent2);
      background: rgba(0, 229, 160, .08);
    }

    .connection-pill.connecting {
      color: var(--warn);
      border-color: var(--warn);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .dot.pulse {
      animation: blink 1s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .2
      }
    }

    /* LEFT PANEL */
    .panel-left {
      background: var(--bg2);
      border-right: 1px solid var(--border);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
    }

    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 7px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 9px 12px;
      outline: none;
      transition: border-color .2s;
    }

    .field input:focus {
      border-color: var(--accent2);
    }

    .field input::placeholder {
      color: var(--muted);
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-connect {
      background: var(--accent);
      color: #000;
    }

    .btn-connect:hover {
      background: #00ffc0;
    }

    .btn-connect:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-disconnect {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
      margin-top: 7px;
    }

    .btn-disconnect:hover {
      background: rgba(255, 92, 92, .08);
    }

    .btn-disconnect:disabled {
      opacity: .3;
      cursor: not-allowed;
      transform: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-box {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .stat-box .num {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .stat-box .num.accent {
      color: var(--accent);
    }

    .stat-box .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* LOG */
    .log-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      height: 130px;
      overflow-y: auto;
      line-height: 1.8;
    }

    .log-box .log-line {
      display: block;
    }

    .log-box .log-line .ts {
      color: #3a3f50;
    }

    .log-box .log-line.ok .ev {
      color: var(--accent);
    }

    .log-box .log-line.err .ev {
      color: var(--danger);
    }

    .log-box .log-line.warn .ev {
      color: var(--warn);
    }

    .log-box .log-line.info .ev {
      color: var(--info);
    }

    /* SEND MSG */
    .send-row {
      display: flex;
      gap: 8px;
    }

    .send-row input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 7px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      transition: border-color .2s;
    }

    .send-row input:focus {
      border-color: var(--accent2);
    }

    .send-row button {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 7px;
      color: var(--accent);
      font-size: 16px;
      padding: 0 14px;
      cursor: pointer;
      transition: all .15s;
      line-height: 1;
    }

    .send-row button:hover {
      background: rgba(0, 229, 160, .1);
    }

    /* RIGHT PANEL */
    .panel-right {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-right-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg2);
    }

    .panel-right-header h2 {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
    }

    .badge-count {
      background: var(--accent);
      color: #000;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 99px;
      display: none;
    }

    .btn-clear {
      font-family: var(--sans);
      font-size: 12px;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      transition: all .15s;
    }

    .btn-clear:hover {
      color: var(--text);
      border-color: var(--border2);
      background: var(--bg3);
    }

    .notif-feed {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      padding: 60px 0;
    }

    .empty-state svg {
      opacity: .3;
    }

    .empty-state p {
      font-size: 13px;
    }

    .notif-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 12px 16px;
      animation: slide-in .22s ease;
    }

    .notif-card.new {
      border-left-color: var(--info);
    }

    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .notif-card-top {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }

    .notif-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
      line-height: 1.4;
    }

    .notif-type-tag {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(0, 229, 160, .1);
      color: var(--accent);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .notif-msg {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .notif-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notif-time {
      font-family: var(--mono);
      font-size: 10px;
      color: #3a3f50;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 2px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
    </div>
    <div>
      <h1>NOTIFICATION TESTER</h1>
      <p>Socket.IO realtime debug tool</p>
    </div>
    <div class="connection-pill" id="conn-pill">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-label">disconnected</span>
    </div>
  </header>

  <!-- LEFT -->
  <aside class="panel-left">

    <div>
      <div class="section-label">⬡ Kết nối</div>
      <div class="field">
        <label>Server URL</label>
        <input type="text" id="server-url" value="http://localhost:3000" placeholder="http://localhost:3000">
      </div>
      <div class="field">
        <label>JWT Token</label>
        <input type="text" id="jwt-token" placeholder="Dán token vào đây...">
      </div>
      <button class="btn btn-connect" id="btn-connect" onclick="connectSocket()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
        Kết nối
      </button>
      <button class="btn btn-disconnect" id="btn-disconnect" onclick="disconnectSocket()" disabled>
        Ngắt kết nối
      </button>
    </div>

    <div>
      <div class="section-label">⬡ Thống kê</div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="num accent" id="stat-total">0</div>
          <div class="stat-label">Tổng thông báo</div>
        </div>
        <div class="stat-box">
          <div class="num" id="stat-unread">0</div>
          <div class="stat-label">Chưa đọc</div>
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">⬡ Activity log</div>
      <div class="log-box" id="log-box">
        <span class="log-line warn"><span class="ts">[--:--:--]</span> <span class="ev">IDLE</span> Chưa có hoạt
          động</span>
      </div>
    </div>

    <div>
      <div class="section-label">⬡ Gửi test message</div>
      <div class="send-row">
        <input type="text" id="test-msg" placeholder="send_message content...">
        <button onclick="sendTestMsg()" title="Gửi">&#10148;</button>
      </div>
    </div>

  </aside>

  <!-- RIGHT -->
  <main class="panel-right">
    <div class="panel-right-header">
      <h2>Notification feed</h2>
      <span class="badge-count" id="badge-count">0</span>
      <button class="btn-clear" onclick="clearFeed()">Xóa tất cả</button>
    </div>

    <div class="notif-feed" id="notif-feed">
      <div class="empty-state" id="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          <line x1="1" y1="1" x2="23" y2="23" />
        </svg>
        <p>Chưa có thông báo — kết nối và trigger event từ server.</p>
      </div>
    </div>
  </main>

  <script>
    let socket = null;
    let total = 0;
    let unread = 0;

    function ts() {
      return new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function log(msg, type = 'info') {
      const box = document.getElementById('log-box');
      const line = document.createElement('span');
      line.className = `log-line ${type}`;
      line.innerHTML = `<span class="ts">[${ts()}]</span> <span class="ev">${msg}</span>`;
      box.insertBefore(document.createElement('br'), box.firstChild);
      box.insertBefore(line, box.firstChild);
    }

    function setConnected(state) {
      const pill = document.getElementById('conn-pill');
      const dot = document.getElementById('conn-dot');
      const label = document.getElementById('conn-label');
      pill.className = 'connection-pill ' + state;
      dot.className = 'dot' + (state === 'connecting' ? ' pulse' : '');
      label.textContent = state === 'connected' ? 'connected' : state === 'connecting' ? 'connecting...' : 'disconnected';
      document.getElementById('btn-connect').disabled = (state !== 'disconnected' && state !== '');
      document.getElementById('btn-disconnect').disabled = (state !== 'connected');
    }

    function connectSocket() {
      const url = document.getElementById('server-url').value.trim();
      const token = document.getElementById('jwt-token').value.trim();
      if (!url || !token) { log('⚠ Nhập URL và JWT token', 'warn'); return; }
      if (socket) { socket.disconnect(); socket = null; }
      setConnected('connecting');
      log(`→ Đang kết nối ${url}`, 'info');
      socket = io(url, {
        auth: { token: `Bearer ${token}` },
        transports: ['websocket', 'polling'],
      });
      socket.on('connect', () => {
        setConnected('connected');
        log(`✓ Connected — id: ${socket.id}`, 'ok');
      });
      socket.on('connect_error', err => {
        setConnected('');
        log(`✗ ${err.message}`, 'err');
      });
      socket.on('disconnect', reason => {
        setConnected('');
        log(`⊘ Disconnected: ${reason}`, 'warn');
      });
      socket.on('notification', data => {
        log(`📨 notification — ${data.title || '?'}`, 'ok');
        addCard(data);
      });
      socket.on('receive_message', data => {
        log(`💬 receive_message: ${data.content}`, 'info');
      });
    }

    function disconnectSocket() {
      if (socket) { socket.disconnect(); socket = null; }
      setConnected('');
    }

    function addCard(data) {
      const feed = document.getElementById('notif-feed');
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();

      total++;
      unread++;
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-unread').textContent = unread;
      const badge = document.getElementById('badge-count');
      badge.style.display = 'inline-block';
      badge.textContent = unread;

      const title = esc(data.title || '(no title)');
      const msg = esc(data.message || JSON.stringify(data));
      const type = data.type || '';
      const time = new Date().toLocaleTimeString('vi-VN');

      const card = document.createElement('div');
      card.className = 'notif-card new';
      card.innerHTML = `
    <div class="notif-card-top">
      <div class="notif-title">${title}</div>
      ${type ? `<span class="notif-type-tag">${esc(type)}</span>` : ''}
    </div>
    <div class="notif-msg">${msg}</div>
    <div class="notif-meta">
      <span class="notif-time">${time}</span>
    </div>`;
      feed.insertBefore(card, feed.firstChild);
      setTimeout(() => card.classList.remove('new'), 300);
    }

    function clearFeed() {
      const feed = document.getElementById('notif-feed');
      feed.innerHTML = `
    <div class="empty-state" id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
      <p>Chưa có thông báo — kết nối và trigger event từ server.</p>
    </div>`;
      unread = 0;
      document.getElementById('stat-unread').textContent = 0;
      document.getElementById('badge-count').style.display = 'none';
    }

    function sendTestMsg() {
      const input = document.getElementById('test-msg');
      const msg = input.value.trim();
      if (!socket || !socket.connected) { log('⚠ Chưa kết nối', 'warn'); return; }
      if (!msg) return;
      socket.emit('send_message', { content: msg });
      log(`→ Sent: ${msg}`, 'info');
      input.value = '';
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.getElementById('test-msg').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendTestMsg();
    });
  </script>
</body>

</html>
